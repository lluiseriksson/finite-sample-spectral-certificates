name: verify-planar-projective-memory

on:
  push:
  pull_request:

concurrency:
  group: planar-projective-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planar-projective-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0 matplotlib==3.10.5
      - run: >-
          python -m compileall -q
          research/planar_projective_memory_certificate.py
          verification/verify_planar_projective_memory.py
          verification/run_planar_projective_release_checks.py
      - run: >-
          python research/planar_projective_memory_certificate.py
          --output results/ci/planar_projective_memory_certificate.json
          --figure results/ci/unbounded_detector_gap.pdf --max-L 16
      - run: cmp results/ci/planar_projective_memory_certificate.json results/planar_projective_memory/certificate.json
      - run: python verification/run_planar_projective_release_checks.py
