name: verify-generic-fanout

on:
  push:
  pull_request:

jobs:
  generic-fanout-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q research/generic_fanout_memory_certificate.py verification/verify_generic_fanout_memory.py verification/run_generic_fanout_memory_release_checks.py
      - name: Replay certificate without mutating frozen artifacts
        run: >-
          python research/generic_fanout_memory_certificate.py
          --output results/ci/generic_fanout_memory_certificate.json
          --figure results/ci/generic_fanout_memory.pdf
      - run: python verification/verify_generic_fanout_memory.py
      - run: python verification/run_generic_fanout_memory_release_checks.py
