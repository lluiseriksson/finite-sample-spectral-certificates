name: verify-routing-word-memory

on:
  push:
  pull_request:

jobs:
  routing-word-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q research/routing_word_memory_certificate.py verification/verify_routing_word_memory.py verification/run_routing_word_memory_release_checks.py
      - name: Replay certificate without mutating frozen artifacts
        run: >-
          python research/routing_word_memory_certificate.py
          --output results/ci/routing_word_memory_certificate.json
          --figure results/ci/routing_word_memory.pdf
          --trials 1024
      - run: python verification/verify_routing_word_memory.py
      - run: python verification/run_routing_word_memory_release_checks.py
